name: 生成 WARP MASQUE 配置
on:
  workflow_dispatch:
    inputs:
      device_name:
        description: 设备名（WARP 后台显示用）
        required: false
        default: gh-actions
      retention_days:
        description: artifact 保留天数
        required: false
        default: '7'
  schedule:
    # 优化 1：降低定时触发频率。改为每 3 天的北京时间清晨 5:30 自动运行一次 (UTC 时间 21:30)
    - cron: '30 21 */3 * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: 下载 usque
        run: |
          set -euo pipefail
          VER=$(curl -sL https://api.github.com/repos/Diniboy1123/usque/releases/latest \
            | jq -r '.tag_name' | sed 's/^v//')
          echo "usque 版本 $VER"
          curl -sL -o usque.zip \
            "https://github.com/Diniboy1123/usque/releases/download/v${VER}/usque_${VER}_linux_amd64.zip"
          unzip -oq usque.zip
          chmod +x usque
          ./usque version 2>/dev/null | grep -i version || true

      - name: 注册设备并生成密钥
        run: |
          set -euo pipefail
          ./usque register -a -n "${{ github.event.inputs.device_name || 'gh-actions' }}"
          test -s config.json
          python3 - <<'PY'
          import json
          c = json.load(open("config.json"))
          print("endpoint_v4 =", c["endpoint_v4"])
          print("endpoint_v6 =", c["endpoint_v6"])
          print("内网地址 =", c["ipv4"], "/", c["ipv6"])
          PY

      # 优化 2：在生成配置前，用 Python 脚本自动将 V6 节点池清空，只保留 V4 节点
      - name: 仅保留 IPv4 节点（精简 IPv6）
        run: |
          python3 -c "
          import re
          with open('scripts/gen_masque.py', 'r', encoding='utf-8') as f:
              content = f.read()
          # 匹配 V6 = [...] 并清空为 V6 = []
          content = re.sub(r'V6\s*=\s*\\[.*?\\]', 'V6 = []', content, flags=re.DOTALL)
          with open('scripts/gen_masque.py', 'w', encoding='utf-8') as f:
              f.write(content)
          "

      - name: 生成 mihomo 配置
        run: python3 scripts/gen_masque.py config.json dist

      - name: 校验配置可加载
        run: |
          set -euo pipefail
          URL=$(curl -sL https://api.github.com/repos/MetaCubeX/mihomo/releases \
            | grep -o 'https://[^\"]*mihomo-linux-amd64-alpha[^\"]*\.gz' | head -1)
          curl -sL -o mihomo.gz "$URL"
          gunzip -f mihomo.gz
          chmod +x mihomo
          mkdir -p check
          cp dist/warp-masque.yaml check/config.yaml
          ./mihomo -t -d check
          echo "配置校验通过"

      - name: 打包凭据与配置
        run: |
          cp config.json dist/usque-config.json
          test -s dist/warp-masque.yaml
          test -s dist/warp-masque-shadowrocket.txt
          ls -l dist

      - name: 上传 artifact
        uses: actions/upload-artifact@v6
        with:
          name: warp-masque-config
          path: dist/
          retention-days: ${{ github.event.inputs.retention_days || 7 }}
          if-no-files-found: error

      - name: 自动将节点配置文件提交回仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          mkdir -p sub
          cp dist/warp-masque.yaml sub/warp-masque.yaml
          
          git add sub/warp-masque.yaml
          if git diff --staged --quiet; then
            echo "节点配置无变化，无需更新"
          else
            git commit -m "Auto-update WARP-Masque config at $(date)"
            git push
          fi
